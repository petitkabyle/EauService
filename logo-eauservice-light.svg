<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 92" width="384" height="92" role="img" aria-label="EauService by Events Café">
  <defs>
    <linearGradient id="esGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6FD9"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="esDropL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EDFB"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="10" y="14" width="64" height="64" rx="18" fill="url(#esGradL)"/>
  <!-- Goutte d'eau -->
  <path d="M42 26 C42 26 57 43 57 53 a15 15 0 1 1 -30 0 C27 43 42 26 42 26 Z" fill="url(#esDropL)"/>
  <!-- Reflet -->
  <path d="M37 50 a6 9 0 0 0 -3 13" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Texte principal -->
  <text x="92" y="53" font-family="Outfit, Poppins, 'Segoe UI', Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-1">
    <tspan fill="#1E6FD9">Eau</tspan><tspan fill="#0A1628">Service</tspan>
  </text>
  <!-- Sous-titre -->
  <text x="94" y="72" font-family="Outfit, Poppins, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#5B6B82">BY EVENTS CAFÉ</text>
</svg>
