<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 104" width="430" height="104" role="img" aria-label="EauService by Events Café">
  <defs>
    <linearGradient id="esGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7FE6"/>
      <stop offset="1" stop-color="#67ABFF"/>
    </linearGradient>
    <linearGradient id="esDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E8FC"/>
    </linearGradient>
  </defs>

  <!-- Emblème : anneau fin + disque dégradé -->
  <circle cx="52" cy="52" r="41" fill="none" stroke="#3B9EFF" stroke-width="1.4" opacity="0.35"/>
  <circle cx="52" cy="52" r="35" fill="url(#esGrad)"/>
  <!-- Goutte d'eau épurée -->
  <path d="M52 30 C52 30 67 47 67 57 a15 15 0 1 1 -30 0 C37 47 52 30 52 30 Z" fill="url(#esDrop)"/>
  <!-- Reflet doux -->
  <path d="M46 54 a7 10 0 0 0 -3 14" fill="none" stroke="#67ABFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Étincelle événementielle -->
  <path d="M77 30 l2.2 5.6 5.6 2.2 -5.6 2.2 -2.2 5.6 -2.2 -5.6 -5.6 -2.2 5.6 -2.2 Z" fill="#BAE6FD" opacity="0.95"/>

  <!-- Mot-symbole -->
  <text x="108" y="58" font-family="Outfit, Poppins, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#67ABFF">Eau</tspan><tspan fill="#FFFFFF" font-weight="800">Service</tspan>
  </text>
  <!-- Sous-titre événementiel -->
  <text x="110" y="80" font-family="Outfit, Poppins, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.4" fill="#9DB4D4">LOCATION ÉVÉNEMENTIELLE · CÔTE D'AZUR</text>
</svg>
